<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>megatoy</title>
    <link rel="icon" type="image/x-icon" href="icon.ico" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        /* A long press neither selects the page nor opens its menu. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        /* Touches go to the app, not to the page's scrolling and zooming. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      var Module = Module || {};
      var canvas = document.getElementById("canvas");
      canvas.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });
      Module.canvas = canvas;
      // The browser stops the sound when the phone sleeps or the tab is
      // hidden; the next touch or key brings it back.
      function resumeAudio() {
        var sdl = Module["SDL3"];
        var context = sdl && sdl.audioContext;
        if (context && context.state !== "running") {
          context.resume();
        }
      }
      ["touchend", "pointerup", "keydown"].forEach(function (type) {
        document.addEventListener(type, resumeAudio, true);
      });
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          resumeAudio();
        }
      });
    </script>
    <script src="megatoy.js"></script>
  </body>
</html>
